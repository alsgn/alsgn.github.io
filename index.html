<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스크린리더 예시 페이지</title>

<body>
    <h1 tabindex="0">스크린리더 테스트</h1>
    <p tabindex="0">이 페이지는 스크린리더 기능을 테스트하기 위한 예시입니다.</p>

    <button aria-label="닫기">닫기</button>

    <a tabindex="0" href="https://www.example.com" aria-label="외부 링크">외부 링크</a>
    <a tabindex="0" href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png" alt="비트맵 예시 이미지" /></a>
    <div>
        <span tabindex="0">텍스트만 있는 영역</span>
    </div>

    <div>
        <a href="#"><span class="icon-text">아이콘 텍스트</span></a>
    </div>
    <div>
        <img tabindex="0" src="https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png" />
    </div>
    <div>
        <link tabindex="0" rel="image_src" href="https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png" />
