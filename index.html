<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SDGs — 데이터와 협력</title>
    <style>
      @import url("");
      :root {
        --paper: #f5f3ee;
        --ink: #202021;
        --muted: #77746f;
        --violet: #bdb4ff;
        --coral: #ff6247;
        --yellow: #ffb928;
        --teal: #4dbcb6;
        --blue: #a9d2ef;
        --green: #b8d884;
        --white: #fffdf8;
        --shadow: 0 14px 34px rgba(35, 29, 24, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #e8e5de;
        color: var(--ink);
        font-family:
          "S-Core Dream", "SCoreDream", "에스코어 드림", Pretendard,
          "Apple SD Gothic Neo", sans-serif;
        letter-spacing: -0.035em;
        overflow: hidden;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 48px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        color: #6e6a63;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .brand {
        font-weight: 800;
        color: #252321;
      }
      .top-right {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .progress {
        width: 88px;
        height: 3px;
        background: #d4d0c8;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--coral);
        transition: width 0.3s;
      }
      .stage {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
        padding: 8px 24px 18px;
      }
      .slide {
        display: none;
        position: relative;
        flex: none;
        width: min(calc((100vh - 128px) * 1.7778), calc(100vw - 48px));
        height: min(calc(100vh - 128px), calc((100vw - 48px) * 0.5625));
        min-height: 0;
        overflow: hidden;
        border-radius: 17px;
        background: var(--paper);
        box-shadow: var(--shadow);
        padding: 6.1% 7%;
        isolation: isolate;
      }
      .slide.active {
        display: flex;
        flex-direction: column;
      }
      .slide:before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--bg, var(--paper));
      }
      .slide:after {
        content: "";
        position: absolute;
        width: 29%;
        aspect-ratio: 1;
        right: -11%;
        bottom: -19%;
        border-radius: 50%;
        background: var(--accent, var(--yellow));
        opacity: 0.95;
        z-index: -1;
      }
      .slide.cover {
        --bg: var(--violet);
        --accent: var(--coral);
      }
      .slide.section {
        --bg: var(--coral);
        --accent: var(--yellow);
      }
      .slide.section.large-divider {
        justify-content: center;
        padding: 7% 8%;
        container-type: inline-size;
      }
      .large-divider .title {
        font-size: clamp(32px, 7.8cqw, 108px);
        line-height: 1.14;
        letter-spacing: -0.02em;
        max-width: 100%;
        margin: 0;
      }
      .large-divider .eyebrow {
        position: absolute;
        top: 9%;
        left: 8%;
      }
      .large-divider .side,
      .large-divider .subtitle,
      .large-divider .footer {
        display: none;
      }
      .slide.dark {
        --bg: #252321;
        --accent: var(--teal);
        color: var(--white);
      }
      .slide.yellow {
        --bg: var(--yellow);
        --accent: var(--violet);
      }
      .slide.teal {
        --bg: var(--teal);
        --accent: var(--yellow);
      }
      .slide.blue {
        --bg: var(--blue);
        --accent: var(--coral);
      }
      #stage > .slide,
      #stage > .slide.active {
        width: min(
          calc((100vh - 128px) * 1.7778),
          calc(100vw - 48px)
        ) !important;
        height: min(
          calc(100vh - 128px),
          calc((100vw - 48px) * 0.5625)
        ) !important;
        max-width: none;
        max-height: none;
        aspect-ratio: 16/9;
        flex: none;
      }
      .eyebrow {
        font-size: clamp(10px, 1vw, 14px);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.72;
        margin-bottom: 1.6%;
      }
      .title {
        font-size: clamp(24px, 3.4vw, 50px);
        line-height: 1.17;
        font-weight: 800;
        letter-spacing: -0.06em;
        max-width: 86%;
        margin: 0 0 2.8%;
      }
      .subtitle {
        font-size: clamp(13px, 1.42vw, 20px);
        line-height: 1.5;
        max-width: 72%;
        font-weight: 500;
        color: color-mix(in srgb, currentColor 78%, transparent);
        margin: 0 0 3%;
      }
      .body {
        display: grid;
        grid-template-columns: 1fr 34%;
        gap: 5%;
        align-items: center;
        flex: 1;
        min-height: 0;
      }
      .body.full {
        grid-template-columns: 1fr;
      }
      .points {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: clamp(8px, 1.2vw, 16px);
      }
      .points li {
        font-size: clamp(13px, 1.5vw, 21px);
        line-height: 1.42;
        padding-left: 1.05em;
        position: relative;
        max-width: 58em;
      }
      .points li:before {
        content: "";
        position: absolute;
        width: 0.38em;
        height: 0.38em;
        border-radius: 50%;
        left: 0;
        top: 0.53em;
        background: var(--dot, var(--coral));
      }
      .dark .points li:before {
        background: var(--yellow);
      }
      .points strong {
        font-weight: 800;
      }
      .side {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70%;
        position: relative;
      }
      .shape {
        width: min(100%, 260px);
        aspect-ratio: 1;
        border-radius: 29% 71% 55% 45%/45% 45% 55% 55%;
        background: var(--accent, var(--yellow));
        display: grid;
        place-items: center;
        transform: rotate(-7deg);
        position: relative;
      }
      .shape:before,
      .shape:after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: var(--bg, var(--paper));
        opacity: 0.55;
      }
      .shape:before {
        width: 25%;
        height: 25%;
        left: 14%;
        top: 12%;
      }
      .shape:after {
        width: 13%;
        height: 13%;
        right: 12%;
        bottom: 17%;
      }
      .bigstat {
        font-size: clamp(42px, 7vw, 100px);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.09em;
      }
      .statlabel {
        font-size: clamp(12px, 1.3vw, 18px);
        line-height: 1.4;
        font-weight: 700;
        margin-top: 12px;
        max-width: 15em;
        text-align: center;
      }
      .statbox {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10%;
        background: var(--white);
        border-radius: 18px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
        transform: rotate(2deg);
        min-width: 72%;
      }
      .dark .statbox {
        color: var(--ink);
      }
      .mini {
        font-size: clamp(10px, 1vw, 14px);
        color: var(--muted);
        margin-top: auto;
        padding-top: 2%;
        position: relative;
        z-index: 1;
      }
      .dark .mini {
        color: #c4c1ba;
      }
      .source-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25em 1.2em;
        line-height: 1.35;
      }
      .source-links a {
        color: inherit;
        text-decoration: underline;
        text-decoration-color: currentColor;
        text-underline-offset: 2px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2%;
        width: 100%;
      }
      .card {
        background: var(--white);
        padding: 5% 6%;
        border-radius: 16px;
        min-height: 96px;
        box-shadow: 0 7px 20px rgba(0, 0, 0, 0.06);
      }
      .card b {
        font-size: clamp(23px, 3vw, 42px);
        display: block;
        line-height: 1.1;
        letter-spacing: -0.07em;
      }
      .card span {
        font-size: clamp(11px, 1.1vw, 15px);
        display: block;
        margin-top: 9px;
        line-height: 1.35;
        color: #66615b;
      }
      .dark .card {
        color: var(--ink);
      }
      .chart {
        width: 100%;
        display: grid;
        gap: 12px;
      }
      .barrow {
        display: grid;
        grid-template-columns: 90px 1fr 46px;
        gap: 10px;
        align-items: center;
        font-size: clamp(10px, 1.1vw, 15px);
        font-weight: 700;
      }
      .bartrack {
        height: 16px;
        border-radius: 20px;
        background: rgba(30, 30, 30, 0.1);
        overflow: hidden;
      }
      .barfill {
        height: 100%;
        border-radius: 20px;
        background: var(--bar, var(--coral));
        width: var(--w);
      }
      .barrow em {
        font-style: normal;
        text-align: right;
      }
      .compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2%;
        width: 100%;
      }
      .compare > div {
        background: var(--white);
        border-radius: 15px;
        padding: 5%;
        box-shadow: 0 7px 20px rgba(0, 0, 0, 0.06);
      }
      .compare h3 {
        font-size: clamp(14px, 1.6vw, 22px);
        margin: 0 0 14px;
      }
      .compare p {
        font-size: clamp(12px, 1.25vw, 17px);
        line-height: 1.45;
        margin: 8px 0;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: clamp(11px, 1.15vw, 16px);
        background: var(--white);
        border-radius: 14px;
        overflow: hidden;
      }
      .table th,
      .table td {
        text-align: left;
        vertical-align: top;
        padding: 1.7% 2%;
        border-bottom: 1px solid #e7e3dc;
        line-height: 1.35;
      }
      .table th {
        background: rgba(255, 185, 40, 0.35);
        font-weight: 800;
      }
      .table tr:last-child td {
        border-bottom: 0;
      }
      .question {
        font-size: clamp(22px, 3.2vw, 46px);
        line-height: 1.24;
        font-weight: 800;
        max-width: 84%;
        letter-spacing: -0.055em;
      }
      .footer {
        position: absolute;
        bottom: 4.3%;
        left: 7%;
        font-size: 10px;
        letter-spacing: 0.06em;
        opacity: 0.58;
      }
      .page {
        position: absolute;
        bottom: 4.1%;
        right: 7%;
        font-size: 11px;
        font-weight: 800;
        opacity: 0.65;
      }
      .cover .title {
        font-size: clamp(38px, 6vw, 86px);
        max-width: 75%;
        margin-top: 5%;
      }
      .cover .subtitle {
        font-size: clamp(16px, 2vw, 28px);
        max-width: 60%;
      }
      .cover-art {
        position: absolute;
        right: 7%;
        bottom: 8%;
        width: 26%;
        aspect-ratio: 1;
        border-radius: 45% 55% 41% 59%/45% 40% 60% 55%;
        background: var(--yellow);
        transform: rotate(9deg);
        display: grid;
        place-items: center;
        box-shadow: 10px 12px 0 rgba(32, 32, 33, 0.13);
      }
      .controls {
        height: 54px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #55514b;
      }
      .controls button {
        border: 0;
        background: var(--white);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 3px 9px rgba(0, 0, 0, 0.08);
      }
      .controls button:hover {
        background: var(--yellow);
      }
      .counter {
        font-size: 12px;
        min-width: 54px;
        text-align: center;
        font-weight: 700;
      }
      .hint {
        font-size: 11px;
        color: #858078;
        position: absolute;
        right: 24px;
      }
      .overview {
        position: fixed;
        inset: 0;
        background: rgba(28, 27, 25, 0.88);
        z-index: 10;
        display: none;
        overflow: auto;
        padding: 35px;
      }
      .overview.open {
        display: block;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }
      .thumb {
        aspect-ratio: 16/9;
        border-radius: 12px;
        box-shadow: 0 5px 15px #0004;
        padding: 17px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        cursor: pointer;
        overflow: hidden;
      }
      .thumb b {
        font-size: 16px;
        line-height: 1.2;
      }
      .thumb small {
        opacity: 0.65;
        font-size: 10px;
      }
      .close {
        position: fixed;
        top: 14px;
        right: 20px;
        border: 0;
        border-radius: 50%;
        width: 38px;
        height: 38px;
        font-size: 18px;
        cursor: pointer;
      }
      @media (max-width: 700px) {
        .topbar {
          padding: 0 12px;
        }
        .stage {
          padding: 5px 8px 12px;
        }
        .slide {
          width: min(calc((100vh - 119px) * 1.7778), calc(100vw - 16px));
          height: min(calc(100vh - 119px), calc((100vw - 16px) * 0.5625));
          padding: 7% 6%;
          border-radius: 12px;
        }
        .title {
          max-width: 98%;
        }
        .subtitle {
          max-width: 95%;
        }
        .body {
          grid-template-columns: 1fr 28%;
          gap: 3%;
        }
        .points li {
          font-size: clamp(10px, 2.2vw, 15px);
          gap: 5px;
        }
        .side {
          min-height: 40%;
        }
        .shape {
          width: 100%;
        }
        .cards {
          gap: 1%;
        }
        .card {
          padding: 6% 4%;
          min-height: 0;
        }
        .footer {
          left: 6%;
        }
        .page {
          right: 6%;
        }
        .hint {
          display: none;
        }
      }
      @media (max-width: 700px) {
        #stage > .slide,
        #stage > .slide.active {
          width: min(
            calc((100vh - 119px) * 1.7778),
            calc(100vw - 16px)
          ) !important;
          height: min(
            calc(100vh - 119px),
            calc((100vw - 16px) * 0.5625)
          ) !important;
        }
      }
    </style>
    <style id="editorial-overrides">
      .slide.roomy-copy {
        container-type: inline-size;
      }
      .slide.roomy-copy .points {
        gap: clamp(14px, 2cqw, 28px);
      }
      .slide.roomy-copy .points li {
        font-size: clamp(15px, 2.6cqw, 30px);
        line-height: 1.7;
      }
      .slide.emphasis-copy {
        container-type: inline-size;
      }
      .slide.emphasis-copy .lead-copy {
        font-size: clamp(14px, 2.8cqw, 32px);
        line-height: 1.6;
        font-weight: 800;
        max-width: 100%;
      }
      .slide.sdg16-tone {
        --bg: #00689d;
        --accent: #00689d;
        color: #ffffff;
      }
      .slide.sdg17-tone {
        --bg: #19486a;
        --accent: #19486a;
        color: #ffffff;
      }
      .slide.sdg16-tone:after,
      .slide.sdg17-tone:after {
        display: none;
      }
      .sdg16-tone .mini,
      .sdg16-tone .photo figcaption,
      .sdg17-tone .mini,
      .sdg17-tone .photo figcaption {
        color: #d9e6ef;
      }
      .points li:before {
        content: "-";
        width: auto;
        height: auto;
        border-radius: 0;
        top: 0;
        background: none;
        font-weight: 700;
        color: currentColor;
      }
      .dark .points li:before {
        background: none;
        color: var(--yellow);
      }
      .rows {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(125px, 24%) 1fr;
        gap: 18px;
        align-items: start;
        padding: 14px 0;
        border-bottom: 1px solid rgba(32, 32, 33, 0.2);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row b {
        font-size: clamp(14px, 1.5vw, 20px);
        line-height: 1.35;
      }
      .row span {
        font-size: clamp(13px, 1.35vw, 18px);
        line-height: 1.45;
        color: inherit;
      }
      .media-placeholder {
        width: 100%;
        aspect-ratio: 1.25;
        min-height: 150px;
        display: grid;
        place-items: center;
        border: 1px dashed rgba(32, 32, 33, 0.45);
        color: #77746f;
        font-size: clamp(12px, 1.1vw, 15px);
        letter-spacing: 0;
        background: rgba(255, 253, 248, 0.18);
      }
      #stage .shape,
      #stage .cover-art {
        display: none;
      }
      @media (max-width: 700px) {
        .row {
          grid-template-columns: 1fr;
          gap: 4px;
          padding: 8px 0;
        }
        .media-placeholder {
          min-height: 90px;
        }
      }
    </style>
    <style id="photo-and-intro">
      .verbatim .title {
        max-width: 100%;
      }
      .verbatim-copy {
        white-space: pre-line;
        font-size: clamp(16px, 1.75vw, 25px);
        line-height: 1.7;
        font-weight: 500;
      }
      .verbatim-with-photo,
      .section-image-layout {
        display: grid;
        grid-template-columns: 1fr 42%;
        gap: 6%;
        align-items: center;
        flex: 1;
        min-height: 0;
      }
      .section-image-layout .title {
        max-width: 100%;
        margin: 0;
      }
      .section-image-layout .photo {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100%;
        min-height: 0;
      }
      .photo.support-photo img {
        aspect-ratio: auto;
        object-fit: contain;
      }
      .photo.report-cover img {
        width: auto;
        max-width: 100%;
        height: 0;
        flex: 1;
        min-height: 0;
        aspect-ratio: auto;
        object-fit: contain;
      }
      .photo-credit {
        display: block;
        margin-top: 3px;
      }
      .verbatim-graph {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        gap: 12px;
      }
      .verbatim-graph .verbatim-copy {
        font-size: clamp(13px, 1.4vw, 20px);
        line-height: 1.4;
      }
      .verbatim-graph .graph-image {
        flex: 1;
        height: 0;
        min-height: 0;
      }
      .lead-copy {
        font-size: clamp(17px, 2vw, 28px);
        line-height: 1.62;
        font-weight: 500;
        margin: 0;
        max-width: 37em;
      }
      .photo {
        width: 100%;
        margin: 0;
        align-self: center;
      }
      .photo img {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: 6px;
      }
      .photo figcaption {
        font-size: clamp(9px, 0.85vw, 12px);
        line-height: 1.35;
        margin-top: 8px;
        color: #68645e;
      }
      .photo a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .photo.ihl-photo img {
        aspect-ratio: 16 / 10;
        object-fit: cover;
      }
      .photo.institution-photo img {
        aspect-ratio: 16 / 10;
        object-fit: cover;
      }
      @media (max-width: 700px) {
        .lead-copy {
          font-size: clamp(12px, 2.5vw, 16px);
        }
        .photo figcaption {
          font-size: 9px;
        }
      }
    </style>
    <style id="graph-image-slides">
      .slide.image-slide {
        --bg: #fff !important;
        --accent: #fff !important;
        padding: 4% 5%;
      }
      .slide.image-slide:after {
        display: none;
      }
      .image-slide .eyebrow {
        margin-bottom: 0.6%;
      }
      .image-slide .title {
        font-size: clamp(19px, 2.45vw, 34px);
        margin-bottom: 1.4%;
        max-width: 95%;
      }
      .body.full-media {
        grid-template-columns: 1fr;
      }
      .graph-image {
        width: 100%;
        height: 100%;
        min-height: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .graph-image img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
      }
    </style>
    <style id="conflict-summary-layout">
      .conflict-summary {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .summary-years {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 5%;
        align-items: center;
        padding-bottom: 18px;
        border-bottom: 1px solid rgba(32, 32, 33, 0.22);
      }
      .summary-year span {
        display: block;
        font-size: clamp(13px, 1.2vw, 17px);
        font-weight: 700;
        color: #625f59;
      }
      .summary-year strong {
        font-size: clamp(38px, 5.8vw, 78px);
        line-height: 1.05;
        letter-spacing: -0.055em;

          section: "17.16",
          kind: "verbatim",
          title: "문제2. 장기적인 지원계획 제공 부족",
          literal: "- 구체적이고 장기적인 지원계획은",
        },
      ];
      const stage = document.querySelector("#stage");
      function esc(s = "") {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function list(items = []) {
        return `<ul class="points">${items.map((x) => `<li>${x}</li>`).join("")}</ul>`;
      }
      function directionGraph() {
        return `<div class="direction-graphic">
          <div class="direction-top">
            <section class="death-compare">
              <div class="direction-label">분쟁 관련 민간인 사망자</div>
              <div class="direction-period">2024년에서 2025년</div>
              <div class="direction-bar"><span>2024</span><i><b style="width:100%"></b></i><strong>48,011명</strong></div>
              <div class="direction-bar"><span>2025</span><i><b style="width:77.4%"></b></i><strong>37,163명</strong></div>
              <div class="decline">전년 대비 23% 감소</div>
            </section>
            <section class="conflict-record">
              <div class="direction-label">세계의 무력분쟁</div>
              <strong>최고 수준</strong>
              <p>제2차 세계대전 이후 가장 많은 무력분쟁</p>
              <a href="https://www.un.org/sg/en/content/highlight/2025-06-25.html" target="_blank" rel="noopener">유엔 사무총장 발언, 2025년 6월 25일</a>
            </section>
          </div>
          <section class="region-strip">
            <div class="direction-label">민간인 사망자의 89%가 두 지역에 집중</div>
            <div class="stacked-region"><i style="width:65%"></i><i style="width:24%"></i><i style="width:11%"></i></div>
            <div class="region-labels"><span>북아프리카와 서아시아 <b>65%</b></span><span>사하라 이남 아프리카 <b>24%</b></span><span>기타 <b>11%</b></span></div>
          </section>
        </div>`;
      }
      function trendGraph() {
        return `<div class="trend-graphs">
          <section class="plot">
            <h3>전 세계 살인율</h3>
            <p class="plot-caption">인구 10만 명당</p>
            <div class="bar-list">
              <div class="measure"><span>2015 실제</span><div class="track"><i class="fill actual" style="width:91%"></i></div><b>5.9</b></div>
              <div class="measure"><span>2024 실제</span><div class="track"><i class="fill actual" style="width:78%"></i></div><b>5.1</b></div>
              <div class="measure"><span>2030 예상</span><div class="track"><i class="fill forecast" style="width:68%"></i></div><b>약 4.4</b></div>
              <div class="measure"><span>2030 목표선</span><div class="track target-track"><i class="fill target" style="width:46%"></i></div><b>약 3.0</b></div>
            </div>
            <p class="plot-note">현재 추세라면 2015년 대비 약 25% 감소 - 목표 기준인 50% 감축에는 못 미침</p>
          </section>
          <section class="plot">
            <h3>분쟁 관련 민간인 사망</h3>
            <p class="plot-caption">확인된 사망자 수</p>
            <div class="bar-list">
              <div class="measure"><span>2024</span><div class="track"><i class="fill conflict-old" style="width:100%"></i></div><b>48,011명</b></div>
              <div class="measure"><span>2025</span><div class="track"><i class="fill conflict-new" style="width:77.4%"></i></div><b>37,163명</b></div>
            </div>
            <div class="change"><strong>-23%</strong><span>3년 연속 증가세가 꺾임</span></div>
          </section>
        </div>`;
      }
      function distributionGraph() {
        return `<div class="distribution-graph">
          <section class="region-plot">
            <h3>2025년 민간인 사망자 지역 비중</h3>
            <div class="bar-list">
              <div class="measure"><span>서아시아 및 북아프리카</span><div class="track"><i class="fill actual" style="width:65%"></i></div><b>65%</b></div>
              <div class="measure"><span>사하라 이남 아프리카</span><div class="track"><i class="fill forecast" style="width:24%"></i></div><b>24%</b></div>
              <div class="measure"><span>기타 지역</span><div class="track"><i class="fill other" style="width:11%"></i></div><b>11%</b></div>
            </div>
            <div class="victim-share"><div><b>약 1/5</b><span>아동</span></div><div><b>약 1/4</b><span>여성</span></div><small>기록된 민간인 사망자 중 비율</small></div>
          </section>
          <section class="safety-plot">
            <p class="plot-caption">밤에 혼자 걸을 때 안전하다고 느끼는 사람</p>
            <strong class="safety-number">66%</strong>
            <div class="steady"><span>2017</span><i></i><span>2025</span></div>
            <p class="plot-note">2017년부터 2025년까지 큰 변화 없이 유지</p>
            <p class="gender-note">모든 지역에서 여성의 안전 체감은 남성보다 낮게 나타남</p>
          </section>
        </div>`;
      }
      function conflictSummaryGraph() {
        return `<div class="conflict-summary">
          <div class="summary-years">
            <div class="summary-year"><span>2024년</span><strong>48,011<small>명</small></strong></div>
            <div class="summary-change">−23%<span>전년 대비</span></div>
            <div class="summary-year current"><span>2025년</span><strong>37,163<small>명</small></strong></div>
          </div>
          <div class="summary-detail">
            <section>
              <h3>기록된 사망자 중</h3>
              <div class="summary-victims"><div><b>약 1/5</b><span>아동</span></div><div><b>약 1/4</b><span>여성</span></div></div>
            </section>
            <section>
              <h3>지역별 기록 비중</h3>
              <div class="summary-regions">
                <div class="summary-region"><span>북아프리카와 서아시아</span><div class="summary-track"><i style="width:65%"></i></div><b>65%</b></div>
                <div class="summary-region"><span>사하라 이남 아프리카</span><div class="summary-track"><i style="width:24%"></i></div><b>24%</b></div>
              </div>
            </section>
          </div>
        </div>`;
      }
      function interpretationGraph() {
        return `<div class="interpretation-slide">
          <div class="interpretation-keywords">
            <div class="keyword-row"><b>추세</b><span>연간 감소, 장기 흐름</span></div>
            <div class="keyword-row"><b>피해 집단</b><span>아동과 여성</span></div>
            <div class="keyword-row"><b>피해 요인</b><span>민간인 밀집 지역 전투, 폭발성 무기</span></div>
            <div class="keyword-row"><b>기록 한계</b><span>미기록 사망, 민간인 식별 불가</span></div>
          </div>
          <div class="interpretation-stat"><strong>65%</strong><span>북아프리카와 서아시아에서 기록된 분쟁 관련 사망자 비중</span></div>
        </div>`;
      }
      function viz(s) {
        if (s.graph === "direction") return directionGraph();
        if (s.graph === "trends") return trendGraph();
        if (s.graph === "distribution") return distributionGraph();
        if (s.graph === "conflict-summary") return conflictSummaryGraph();
        if (s.graph === "interpretation") return interpretationGraph();
        if (s.graphImage)
          return `<figure class="graph-image"><img src="${esc(s.graphImage)}" alt="${esc(s.imageAlt || "")}" loading="lazy"></figure>`;
        if (s.stat)
          return `<div class="statbox"><div class="bigstat">${esc(s.stat)}</div><div class="statlabel">${esc(s.label || "")}</div></div>`;
        if (s.image)
          return `<figure class="photo ${esc(s.imageClass || "")}"><img src="${esc(s.image)}" alt="${esc(s.imageAlt || "")}" loading="lazy"><figcaption><a href="${esc(s.imageSource)}" target="_blank" rel="noopener">${esc(s.imageCaption || "사진 출처: MINUSCA - 방기 시장의 지역사회 치안 활동")}</a>${s.imageCredit ? `<span class="photo-credit">${esc(s.imageCredit)}</span>` : ""}</figcaption></figure>`;
        if (s.chart)
          return `<div class="media-placeholder">그래프 이미지 추가</div>`;
        if (s.compare)
          return `<div class="compare">${s.compare
            .map(
              (a) =>
                `<div><h3>${esc(a[0])}</h3>${a
                  .slice(1)
                  .map((x, i) => `<p>${x}</p>`)
                  .join("")}</div>`,
            )
            .join("")}</div>`;
        if (s.table)
          return `<table class="table"><thead><tr>${s.table[0].map((x) => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${s.table
            .slice(1)
            .map(
              (r) => `<tr>${r.map((x) => `<td>${esc(x)}</td>`).join("")}</tr>`,
            )
            .join("")}</tbody></table>`;
        if (s.cards)
          return `<div class="rows">${s.cards.map((c) => `<div class="row"><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join("")}</div>`;
        return `<div class="shape"></div>`;
      }
      slides.forEach((s, i) => {
        const el = document.createElement("section");
        el.className = `slide ${s.kind || ""} ${s.dark ? "dark" : ""} ${s.graphImage ? "image-slide" : ""} ${s.largeDivider ? "large-divider" : ""}`;
        if (s.roomyCopy) el.classList.add("roomy-copy");
        if (s.emphasisCopy) el.classList.add("emphasis-copy");
        if (s.tone === "sdg16") el.classList.add("sdg16-tone");
        if (s.tone === "sdg17") el.classList.add("sdg17-tone");
        if (!["cover", "section", "question"].includes(s.kind))
          el.classList.add(["yellow", "teal", "blue"][i % 3]);
        el.dataset.section = s.section;
        let content = "";
        if (s.kind === "cover") {
          content = `<div class="eyebrow">${esc(s.section)} - 조별 발표</div><h1 class="title">${esc(s.title).replaceAll("\n", "<br>")}</h1><p class="subtitle">${esc(s.sub)}</p><div class="cover-art"></div><div class="footer">${esc(s.note || "")}</div>`;
        } else if (s.kind === "section") {
          content = s.image
            ? `<div class="eyebrow">${esc(s.section)}</div><div class="section-image-layout"><h1 class="title">${esc(s.title).replaceAll("\n", "<br>")}</h1>${viz(s)}</div>`
            : `<div class="eyebrow">${esc(s.section)}</div><h1 class="title">${esc(s.title).replaceAll("\n", "<br>")}</h1><p class="subtitle">${esc(s.sub || "")}</p><div class="side" style="position:absolute;right:8%;bottom:9%;width:25%;height:36%"><div class="shape"></div></div><div class="footer">${esc(s.note || "")}</div>`;
        } else if (s.kind === "question") {
          content = `<div class="eyebrow">${esc(s.section)} - 생각해볼 질문</div><h1 class="question">${esc(s.title).replaceAll("\n", "<br>")}</h1><p class="subtitle" style="margin-top:4%">${esc(s.sub || "")}</p><div class="side" style="position:absolute;right:9%;bottom:10%;width:20%;height:30%"><div class="shape"></div></div>`;
        } else if (s.kind === "verbatim") {
          if (s.graphImage) {
            const [before, after = ""] = s.literal.split("(그래프)");
            content = `<h2 class="title">${esc(s.title)}</h2><div class="verbatim-graph">${before.trim() ? `<div class="verbatim-copy">${esc(before.trim())}</div>` : ""}<figure class="graph-image"><img src="${esc(s.graphImage)}" alt="${esc(s.imageAlt)}"></figure>${after.trim() ? `<div class="verbatim-copy">${esc(after.trim())}</div>` : ""}</div>${s.sources ? `<div class="mini source-links"><span>출처</span>${s.sources.map(([label, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`).join("")}</div>` : ""}`;
          } else if (s.image) {
            content = `<h2 class="title">${esc(s.title)}</h2><div class="verbatim-with-photo"><div class="verbatim-copy">${esc(s.literal)}</div>${viz(s)}</div>`;
          } else {
            content = `<h2 class="title">${esc(s.title)}</h2><div class="body full"><div class="verbatim-copy">${esc(s.literal)}</div></div>`;
          }
        } else if (s.kind === "minimal") {
          content = `<h1 class="minimal-title">${esc(s.title)}</h1>${s.sub ? `<p class="minimal-subtitle">${esc(s.sub)}</p>` : ""}`;
        } else {
          content = `<div class="eyebrow">${esc(s.section)}</div><h2 class="title">${esc(s.title)}</h2>${s.sub ? `<p class="subtitle">${esc(s.sub)}</p>` : ""}<div class="body ${s.fullMedia ? "full-media" : s.table || s.cards || s.compare || (!s.chart && !s.stat && !s.image) ? "full" : ""}">${s.copy ? `<p class="lead-copy">${esc(s.copy)}</p>` : s.points ? list(s.points) : ""}${s.stat || s.chart || s.table || s.cards || s.compare || s.image || s.graph || s.graphImage ? viz(s) : ""}</div>${s.sources ? `<div class="mini source-links">${s.note ? `<span>${esc(s.note)}</span>` : ""}<span>출처</span>${s.sources.map(([label, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`).join("")}</div>` : s.note ? `<div class="mini">${esc(s.note)}</div>` : ""}`;
        }
        el.innerHTML =
          content +
          `<span class="page">${String(i + 1).padStart(2, "0")}</span>`;
        stage.appendChild(el);
      });
      let at = 0;
      const els = [...document.querySelectorAll(".slide")];
      function show(n) {
        at = (n + els.length) % els.length;
        els.forEach((e, i) => e.classList.toggle("active", i === at));
        let s = slides[at];
        document.querySelector("#counter").textContent =
          `${at + 1} / ${els.length}`;
        document.querySelector("#topCount").textContent =
          `${String(at + 1).padStart(2, "0")} / ${els.length}`;
        document.querySelector("#sectionName").textContent = s.section;
        document.querySelector("#progress").style.width =
          `${((at + 1) / els.length) * 100}%`;
        document.title = `${s.title.replaceAll("\n", " ")} — SDGs`;
        history.replaceState(null, "", `#${at + 1}`);
      }
      function step(d) {
        show(at + d);
      }
      document.querySelector("#prev").onclick = () => step(-1);
      document.querySelector("#next").onclick = () => step(1);
      document.addEventListener("keydown", (e) => {
        if (["ArrowRight", "PageDown", " "].includes(e.key)) {
          e.preventDefault();
          step(1);
        }
        if (["ArrowLeft", "PageUp"].includes(e.key)) {
          e.preventDefault();
          step(-1);
        }
        if (e.key === "Home") show(0);
        if (e.key === "End") show(els.length - 1);
        if (e.key.toLowerCase() === "o") toggleOverview();
      });
      const ov = document.querySelector("#overview"),
        grid = document.querySelector("#grid");
      function toggleOverview() {
        ov.classList.toggle("open");
      }
      document.querySelector("#closeOverview").onclick = toggleOverview;
      slides.forEach((s, i) => {
        let d = document.createElement("div");
        d.className = "thumb";
        d.style.background = getComputedStyle(els[i]).getPropertyValue("--bg");
        d.style.color = els[i].classList.contains("dark") ? "#fff" : "#222";
        d.innerHTML = `<small>${esc(s.section)} - ${String(i + 1).padStart(2, "0")}</small><b>${esc(s.title.replaceAll("\n", " "))}</b>`;
        d.onclick = () => {
          show(i);
          toggleOverview();
        };
        grid.appendChild(d);
      });
      let hash = parseInt(location.hash.slice(1));
      show(
        Number.isFinite(hash) && hash > 0 ? Math.min(hash, els.length) - 1 : 0,
      );
    </script>
  </body>
</html>
